kind: Deployment
apiVersion: apps/v1
metadata:
  name: vcdle-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vcdle
  template:
    metadata:
      labels:
        app: vcdle
    spec:
      nodeSelector:
        machine: bastion
      containers:
        - name: vcdle
          image: ghcr.io/omartheone104/vcdle:latest
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: vcdle-secret
                  key: token

          volumeMounts:
            - name: vcdle-data
              mountPath: /app/data
      volumes:
        - name: vcdle-data
          nfs:
            server: 192.168.0.4
            path: /mnt/nfs/vcdle
