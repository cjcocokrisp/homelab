kind: Deployment
apiVersion: apps/v1
metadata:
  name: vcdle-deployment
spec:
  selector:
    matchLabels:
      app: vcdle
  template:
    metadata:
      labels:
        app: vcdle
    spec:
      containers:
        - name: hot-potato
          image: ghcr.io/omartheone104/vcdle:latest
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: vcdle-secret
                  key: token