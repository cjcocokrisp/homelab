apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hledger-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    name: hledger-web
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: hledger-web
  source:
    repoURL: https://github.com/cjcocokrisp/homelab
    targetRevision: HEAD
    path: k8s/hledger-web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true